<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Inmaculada TV • Transmisión Directa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c12;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin: 0;
        }

        .player-container {
            width: 100%;
            max-width: 100%;
            background: #000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* Barra superior minimalista */
        .header {
            background: #11141f;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2f40;
        }

        .title {
            color: white;
            font-weight: 500;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-badge {
            background: #dc2626;
            color: white;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 30px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .domain {
            color: #6b7280;
            font-size: 0.8rem;
        }

        /* === REPRODUCTOR DE VIDEO NATIVO === */
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            /* Proporción 16:9 perfecta */
            aspect-ratio: 16 / 9;
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            background: #000;
            display: block;
            outline: none;
        }

        /* Controles personalizados sutiles (opcional) */
        .video-wrapper video::-webkit-media-controls {
            background: rgba(0, 0, 0, 0.3);
        }

        /* Barra de estado inferior */
        .footer {
            background: #11141f;
            padding: 14px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            color: #9ca3af;
            font-size: 0.85rem;
            border-top: 1px solid #2a2f40;
            gap: 10px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse {
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        .tech-note {
            color: #4b5563;
            font-size: 0.7rem;
            text-align: center;
            padding: 6px;
            background: #090b10;
            border-top: 1px solid #1f232e;
        }

        /* Ajuste para pantallas grandes (PC) */
        @media (min-width: 1024px) {
            body {
                background: #0f131c;
                padding: 30px;
            }
            .player-container {
                max-width: 1000px;
                border-radius: 24px;
                overflow: hidden;
                border: 1px solid #2f354a;
            }
        }

        /* Ajuste para móviles pequeños */
        @media (max-width: 480px) {
            .header {
                padding: 10px 16px;
            }
            .title {
                font-size: 1rem;
            }
            .footer {
                padding: 12px 16px;
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <!-- Cabecera -->
        <div class="header">
            <div class="title">
                <span>📡 Inmaculada TV</span>
                <span class="live-badge">EN VIVO</span>
            </div>
            <div class="domain">
                transmisión directa
            </div>
        </div>

        <!-- VIDEO PLAYER NATIVO CON HLS -->
        <div class="video-wrapper">
            <video id="videoPlayer" controls playsinline>
                <!-- Fallback si el navegador no soporta HLS nativamente -->
                <source src="https://live20.bozztv.com/akamaissh101/ssh101/inmaculada24/playlist.m3u8" type="application/x-mpegURL">
                Tu navegador no soporta video HTML5.
            </video>
        </div>

        <!-- Pie con información -->
        <div class="footer">
            <div class="status">
                <span class="pulse"></span>
                <span>Transmisión en directo</span>
            </div>
            <div>
                <span style="color: #6b7280;">🔄</span> Calidad automática
            </div>
        </div>
        
        <div class="tech-note">
            ⚡ Usando reproductor nativo · Sin zoom · Sin publicidad
        </div>
    </div>

    <!-- Script para compatibilidad HLS en navegadores que no lo soportan nativamente (ej: algunos móviles) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('videoPlayer');
            const videoSrc = 'https://live20.bozztv.com/akamaissh101/ssh101/inmaculada24/playlist.m3u8';
            
            // Comprobar si el navegador soporta HLS nativamente
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari y navegadores iOS - soporte nativo
                video.src = videoSrc;
            } 
            else if (Hls.isSupported()) {
                // Navegadores que no soportan HLS nativamente (Chrome, Firefox, etc.)
                const hls = new Hls({
                    maxLoadingDelay: 4,
                    minAutoBitrate: 0,
                    lowLatencyMode: true,
                });
                hls.loadSource(videoSrc);
                hls.attachMedia(video);
                
                // Opcional: manejo de errores
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        console.error('Error fatal HLS:', data);
                        // Intentar recuperarse o mostrar mensaje
                        const statusDiv = document.querySelector('.status');
                        if (statusDiv) {
                            statusDiv.innerHTML = '<span style="color:#ef4444;">⚠️ Error en la transmisión</span>';
                        }
                    }
                });
            } 
            else {
                // El navegador no soporta HLS de ninguna forma
                video.innerHTML = 'Tu navegador no soporta transmisiones HLS. Intenta con Chrome, Safari o Firefox actualizado.';
                console.warn('HLS no soportado en este navegador');
            }
        });
    </script>
</body>
</html>
