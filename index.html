<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    
    <!-- ===== ETIQUETAS OPEN GRAPH (para Facebook, LinkedIn, etc.) ===== -->
    <!-- Título que aparecerá en la publicación -->
    <meta property="og:title" content="Inmaculada TV - Transmisión en Vivo" />
    
    <!-- Descripción breve (máximo 2-3 líneas) -->
    <meta property="og:description" content="Disfruta de la transmisión en directo de Inmaculada TV. Música, reflexiones y contenido espiritual las 24 horas." />
    
    <!-- ===== CAMBIA ESTA URL POR LA DE TU IMAGEN ===== -->
    <!-- URL ABSOLUTA de la imagen que quieres como portada -->
    <meta property="og:image" content="https://tu-usuario.github.io/imagen-portada.jpg" />
    
    <!-- URL de tu sitio (la de GitHub Pages) -->
    <meta property="og:url" content="https://github.com/mondragonadurai012-web/inmaculada-tv/blob/main/foto.jpg" />
    
    <!-- Tipo de contenido (website es el más común) -->
    <meta property="og:type" content="website" />
    
    <!-- Nombre del sitio (opcional pero recomendado) -->
    <meta property="og:site_name" content="Inmaculada TV" />
    
    <!-- Título normal de la pestaña del navegador -->
    <title>Inmaculada TV • Transmisión Directa</title>
    
    <style>
        /* Todos tus estilos CSS existentes se quedan IGUAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c12;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin: 0;
        }

        .player-container {
            width: 100%;
            max-width: 100%;
            background: #000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .header {
            background: #11141f;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2f40;
        }

        .title {
            color: white;
            font-weight: 500;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-badge {
            background: #dc2626;
            color: white;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 30px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .domain {
            color: #6b7280;
            font-size: 0.8rem;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            aspect-ratio: 16 / 9;
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            background: #000;
            display: block;
            outline: none;
        }

        .footer {
            background: #11141f;
            padding: 14px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            color: #9ca3af;
            font-size: 0.85rem;
            border-top: 1px solid #2a2f40;
            gap: 10px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse {
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        .tech-note {
            color: #4b5563;
            font-size: 0.7rem;
            text-align: center;
            padding: 6px;
            background: #090b10;
            border-top: 1px solid #1f232e;
        }

        @media (min-width: 1024px) {
            body {
                background: #0f131c;
                padding: 30px;
            }
            .player-container {
                max-width: 1000px;
                border-radius: 24px;
                overflow: hidden;
                border: 1px solid #2f354a;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 10px 16px;
            }
            .title {
                font-size: 1rem;
            }
            .footer {
                padding: 12px 16px;
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="header">
            <div class="title">
                <span>📡 Inmaculada TV</span>
                <span class="live-badge">EN VIVO</span>
            </div>
            <div class="domain">
                transmisión directa
            </div>
        </div>

        <div class="video-wrapper">
            <video id="videoPlayer" controls playsinline>
                <source src="https://live20.bozztv.com/akamaissh101/ssh101/inmaculada24/playlist.m3u8" type="application/x-mpegURL">
                Tu navegador no soporta video HTML5.
            </video>
        </div>

        <div class="footer">
            <div class="status">
                <span class="pulse"></span>
                <span>Transmisión en directo</span>
            </div>
            <div>
                <span style="color: #6b7280;">🔄</span> Calidad automática
            </div>
        </div>
        
        <div class="tech-note">
            ⚡ Usando reproductor nativo · Sin zoom · Sin publicidad
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('videoPlayer');
            const videoSrc = 'https://live20.bozztv.com/akamaissh101/ssh101/inmaculada24/playlist.m3u8';
            
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoSrc;
            } 
            else if (Hls.isSupported()) {
                const hls = new Hls({
                    maxLoadingDelay: 4,
                    minAutoBitrate: 0,
                    lowLatencyMode: true,
                });
                hls.loadSource(videoSrc);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        console.error('Error fatal HLS:', data);
                        const statusDiv = document.querySelector('.status');
                        if (statusDiv) {
                            statusDiv.innerHTML = '<span style="color:#ef4444;">⚠️ Error en la transmisión</span>';
                        }
                    }
                });
            } 
            else {
                video.innerHTML = 'Tu navegador no soporta transmisiones HLS. Intenta con Chrome, Safari o Firefox actualizado.';
            }
        });
    </script>
</body>
</html>
