<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- ✅ Meta tag CLAVE para control de zoom en móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Inmaculada24 • En Vivo</title>
    <style>
        /* Reset total */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0e14;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0; /* Sin padding lateral para máximo aprovechamiento */
        }

        /* Contenedor principal - ocupa todo el ancho disponible */
        .player-wrapper {
            width: 100%;
            max-width: 100%;
            background: #000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        /* Título solo visible en la versión móvil (opcional, lo puedes quitar si prefieres) */
        .brand-mobile {
            background: #0f1219;
            padding: 16px 16px 8px 16px;
            text-align: center;
            border-bottom: 1px solid #2a2f3c;
        }

        .brand-mobile h1 {
            color: white;
            font-size: 1.4rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .brand-mobile .live-badge {
            background: #dc2626;
            color: white;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 30px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ===== CONTENEDOR DEL VIDEO - SOLUCIÓN ANTI-ZOOM ===== */
        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            /* Proporción exacta 16:9 (altura = ancho * 9/16) */
            aspect-ratio: 16 / 9;
            overflow: hidden; /* Evita desbordamientos */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* El iframe - AHORA SIN ZOOM FORZADO */
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            object-fit: contain; /* 🔥 CLAVE: "contain" evita que se corte/zoom */
            background: #000; /* Fondo negro para bordes si hay letterbox */
        }

        /* Barra de estado inferior */
        .status-bar {
            background: #0f1219;
            padding: 14px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            color: #cbd5e1;
            font-size: 0.85rem;
            border-top: 1px solid #2a2f3c;
            gap: 10px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        .note {
            color: #6b7280;
            font-size: 0.75rem;
            text-align: center;
            background: #0a0c12;
            padding: 8px;
            border-top: 1px solid #1e2128;
        }

        /* Estilos específicos para pantallas GRANDES (PC/Tablet) */
        @media (min-width: 768px) {
            body {
                background: #0b0e14;
                padding: 30px;
            }
            
            .player-wrapper {
                max-width: 900px; /* Ancho máximo en PC */
                border-radius: 24px;
                overflow: hidden;
                box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
                border: 1px solid #2d3346;
            }
            
            .brand-mobile {
                background: #0f1219;
                padding: 20px;
                border-bottom: 1px solid #2d3346;
            }
            
            .brand-mobile h1 {
                font-size: 1.8rem;
            }
            
            .video-container {
                aspect-ratio: 16 / 9;
            }
            
            .status-bar {
                padding: 16px 20px;
            }
        }

        /* Ajuste para pantallas muy pequeñas (menos de 400px) */
        @media (max-width: 399px) {
            .brand-mobile h1 {
                font-size: 1.2rem;
            }
            .status-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="player-wrapper">
        <!-- Cabecera -->
        <div class="brand-mobile">
            <h1>
                📺 Inmaculada24 
                <span class="live-badge">EN VIVO</span>
            </h1>
        </div>

        <!-- ===== CONTENEDOR DEL VIDEO (SIN ZOOM) ===== -->
        <div class="video-container">
            <iframe 
                src="https://ssh101.com/inmaculada24?adult=yes" 
                frameborder="0" 
                scrolling="no" 
                allowfullscreen
                webkitallowfullscreen 
                mozallowfullscreen>
            </iframe>
        </div>

        <!-- Barra de información -->
        <div class="status-bar">
            <div class="live-indicator">
                <span class="dot"></span>
                <span>Transmisión en directo</span>
            </div>
            <div>
                📱 Vista optimizada para móvil y PC
            </div>
        </div>
        
        <!-- Nota adicional (opcional) -->
        <div class="note">
            ⚡ Si tienes problemas, refresca la página
        </div>
    </div>
</body>
</html>
